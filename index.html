<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 인테리어 레퍼런스 선택기 v5.7</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--text:#222;--muted:#746f68;--line:#ddd8d0;--dark:#232323;--accent:#9a7445;--ok:#2f6e4f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:1550px;margin:auto;padding:18px 22px 12px;display:flex;justify-content:space-between;gap:18px;align-items:center}
h1{font-size:23px;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.tabs{max-width:1550px;margin:auto;padding:0 22px 12px;display:flex;gap:7px;overflow:auto}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
main{max-width:1550px;margin:auto;padding:20px 22px 60px}
.guide{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 17px;margin-bottom:18px;line-height:1.55}
.guide strong{font-size:15px}.guide .small{color:var(--muted);font-size:13px;margin-top:4px}
.grid,.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card,.sum{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.035)}
.card.primarySel{outline:3px solid var(--dark)}.card.refSel{outline:3px solid var(--accent)}
.imgwrap{aspect-ratio:4/3;background:#e8e4dd;overflow:hidden;position:relative;cursor:pointer}
.imgwrap img,.sumitem img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;left:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.94);font-weight:800}
.verified{background:rgba(232,246,237,.96);color:var(--ok)}
.sel{position:absolute;right:9px;top:9px;font-size:12px;font-weight:900;padding:7px 9px;border-radius:9px;display:none}
.primarySel .sel{display:block;background:var(--dark);color:#fff}.refSel .sel{display:block;background:var(--accent);color:#fff}
.meta{padding:13px 14px 14px}.title{font-weight:850;font-size:16px}.spec{font-size:13px;color:#504d49;line-height:1.45;margin-top:7px;min-height:55px}
.project{font-size:12px;color:var(--muted);border-top:1px solid #eee;margin-top:10px;padding-top:9px}.project a{color:#444}.hint{font-size:11px;color:#8a857f;margin-top:6px}
.sum{padding:14px}.sum h3{margin:0 0 10px}.sumitem{margin-bottom:13px}.sumitem .pic{aspect-ratio:4/3;overflow:hidden;border-radius:10px}.sumitem div{font-size:12px;line-height:1.45;margin-top:5px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:35px;text-align:center;color:var(--muted)}
.hidden{display:none!important}

.export-stage{position:fixed;left:-10000px;top:0;width:1280px;z-index:-1}
.export-sheet{width:1200px;background:#f4f2ee;color:#222;padding:34px 34px 40px;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.export-header{background:#fff;border:1px solid #ddd8d0;border-radius:18px;padding:22px 24px;margin-bottom:18px}
.export-title{font-size:28px;font-weight:800;margin:0 0 8px}
.export-sub{font-size:15px;color:#746f68;line-height:1.55}
.export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.export-section{background:#fff;border:1px solid #ddd8d0;border-radius:18px;padding:16px}
.export-section h2{margin:0 0 12px;font-size:20px}
.export-cards{display:grid;grid-template-columns:1fr;gap:12px}
.export-card{border:1px solid #ece7e0;border-radius:14px;overflow:hidden;background:#fff}
.export-card .pic{aspect-ratio:4/3;background:#e8e4dd;overflow:hidden}
.export-card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.export-card .txt{padding:11px 12px 12px}
.export-card .role{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:5px 8px;background:#232323;color:#fff;margin-bottom:7px}
.export-card .role.ref{background:#9a7445}
.export-card .name{font-size:15px;font-weight:800;line-height:1.35}
.export-card .desc{font-size:12px;color:#504d49;line-height:1.5;margin-top:6px}
.export-card .src{font-size:11px;color:#8a857f;line-height:1.4;margin-top:6px;word-break:break-all}
.export-empty{background:#fff;border:1px dashed #ddd8d0;border-radius:18px;padding:40px;text-align:center;color:#746f68}

@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}main{padding:14px}.grid,.summary{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<header>
<div class="top">
  <div>
    <h1>우리집 인테리어 레퍼런스 선택기 v5.7</h1>
    <div class="subtitle">부분 간살 원슬라이딩 대표 사진을 사용자 지정 이미지로 교체 · PNG 저장 개선 유지</div>
  </div>
  <div class="actions">
    <button id="exportBtn">선택 결과 이미지 저장</button>
    <button class="primary" id="shareBtn">선택 결과 링크 복사</button>
    <button id="resetBtn">선택 초기화</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="guide" id="guide"></div>
  <section id="cardSection"><div class="grid" id="grid"></div></section>
  <section id="resultSection" class="hidden"><div class="summary" id="summary"></div></section>
</main>

<script>
const DATA = {"categories": [{"id": "wall", "label": "벽지·천장지", "desc": "실제 30~40평대 사례에서 자주 보이는 벽지+천장지 조합을 제품명/품번 중심으로 비교합니다."}, {"id": "floor", "label": "바닥·마루", "desc": "많이 쓰이는 우드 강마루·스톤형 강마루·타일형 강마루 조합을 벽지와 함께 비교합니다."}, {"id": "living_tv", "label": "거실 TV벽", "desc": "TV가 있는 벽을 어떻게 만들지 고릅니다: 반매립, 무장식, 플로팅장, 풀수납, 히든도어."}, {"id": "living_window", "label": "거실 창가·소파쪽", "desc": "TV 반대편/창가 쪽 구성입니다: 커튼박스, 벤치, 수납, 소파벽, 확장형 창가."}, {"id": "kstruct", "label": "주방 구조", "desc": "아일랜드 유무뿐 아니라 아일랜드 위에 무엇을 넣는지까지 구분합니다: 수납만 / 인덕션 / 싱크 / 둘 다."}, {"id": "kfinish", "label": "주방 마감·가구", "desc": "냉장고장, 키큰장, 후드, 상·하부장, 상판 같은 디테일을 고릅니다."}, {"id": "bath1", "label": "거실욕실", "desc": "거실욕실/안방욕실 카드 종류를 동일하게 보여줍니다. 두 욕실 톤을 맞추기 쉽게 슈퍼셋 10개를 공통 제공."}, {"id": "bath2", "label": "안방욕실", "desc": "거실욕실/안방욕실 카드 종류를 동일하게 보여줍니다. 두 욕실 톤을 맞추기 쉽게 슈퍼셋 10개를 공통 제공."}, {"id": "entry", "label": "현관·중문", "desc": "중문이 실제로 보이는 유형 위주로 비교합니다: 3연동, 원슬라이딩, 스윙, 여닫이, 우드 간살, 중문 없음."}, {"id": "door", "label": "방문·문선", "desc": "방문이 잘 보이는 사진 위주입니다. 무문선, 9mm 문선, 일반 얇은 문선, 우드문, 히든도어를 비교합니다."}, {"id": "film", "label": "창호·필름 (보류)", "desc": "요청대로 이번 버전에서는 추가 보강하지 않았습니다."}, {"id": "light", "label": "거실 조명·천장", "desc": "거실 기준 조합을 늘렸습니다: 우물+간접+실링팬, 평천장+다운라이트, 커튼박스 간접, 라인조명 등."}, {"id": "dress", "label": "드레스룸 (보류)", "desc": "요청대로 이번 버전에서는 추가 보강하지 않았습니다."}], "cards": [{"id": "w1", "cat": "wall", "title": "디아망 회벽 크림화이트 + 같은 천장", "kind": "벽/천장 동일", "spec": "LX 디아망 PR002-12를 벽과 천장 모두 사용. 가장 무난하고 톤 차이가 없는 웜화이트 조합.", "img": "https://prs.ohousecdn.com/apne2/content/uploads/cards/project/v1-525422158188672.jpg?c=c&h=640&w=960", "src": "https://contents.ohou.se/projects/197890", "project": "에코타운 3단지 30평대", "verified": true, "popular": true}, {"id": "w2", "cat": "wall", "title": "디아망 크림화이트 + 오프화이트 천장", "kind": "벽 한 톤 진하게", "spec": "벽: LX 디아망 PR002-12 / 천장: 서울벽지 카라 1001-1 오프화이트. 벽 질감은 살리고 천장은 조금 더 밝게.", "img": "https://prs.ohousecdn.com/apne2/content/uploads/cards/project/v1-521849416695872.jpg?c=c&h=640&w=960", "src": "https://contents.ohou. let active = DATA.categories[0].id;
let selections = {};

try {
  selections = JSON.parse(localStorage.getItem("interior-v4-selections") || "{}");
} catch (e) {
  selections = {};
}

const params = new URLSearchParams(location.search);
if (params.get("s")) {
  try {
    selections = JSON.parse(decodeURIComponent(atob(params.get("s"))));
  } catch (e) {}
}

function getCategory(id) {
  return DATA.categories.find(c => c.id === id);
}

function getCards(id) {
  return DATA.cards.filter(c => c.cat === id);
}

function saveSelections() {
  localStorage.setItem("interior-v4-selections", JSON.stringify(selections));
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  [...DATA.categories, {id:"result", label:"선택 결과"}].forEach(c => {
    const b = document.createElement("div");
    b.className = "tab" + (active === c.id ? " active" : "");
    const countText = c.id === "result" ? "" : " (" + getCards(c.id).length + ")";
    b.textContent = c.label + countText;
    b.onclick = () => {
      active = c.id;
      render();
    };
    el.appendChild(b);
  });
}

function cycleSelection(card) {
  if (!selections[card.cat]) selections[card.cat] = {};
  const current = selections[card.cat][card.id];

  if (!current) {
    Object.keys(selections[card.cat]).forEach(k => {
      if (selections[card.cat][k] === "primary") {
        selections[card.cat][k] = "ref";
      }
    });
    selections[card.cat][card.id] = "primary";
  } else if (current === "primary") {
    selections[card.cat][card.id] = "ref";
  } else {
    delete selections[card.cat][card.id];
  }

  const keys = Object.keys(selections[card.cat]);
  if (keys.length > 3) {
    const firstRef = keys.find(k => selections[card.cat][k] === "ref");
    if (firstRef) delete selections[card.cat][firstRef];
  }

  saveSelections();
  renderCards();
}

function placeholderData(title){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="100%" height="100%" fill="#ede8e0"/><rect x="26" y="26" width="748" height="548" rx="24" fill="#ffffff" stroke="#ddd8d0"/><text x="50%" y="44%" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" fill="#6f6a63">이미지 확인 필요</text><text x="50%" y="52%" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#9a7445">'+title.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text><text x="50%" y="60%" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#8a857f">원본/출처 보기 링크도 함께 확인하세요</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function swapFallback(img){
  var list=(img.dataset.fallbacks||'').split('||').filter(Boolean);
  var idx=parseInt(img.dataset.fallbackIndex||'0',10);
  if(idx < list.length){
    img.dataset.fallbackIndex=String(idx+1);
    img.src=list[idx];
    return;
  }
  img.onerror=null;
  img.src=placeholderData(img.alt||'이미지');
}
function imageMarkup(card) {
  var fb=(card.fallbacks||[]).join('||').replace(/"/g,'&quot;');
  return '<img src="' + card.img + '" alt="' + card.title.replace(/"/g, "&quot;") + '" data-fallbacks="' + fb + '" data-fallback-index="0" loading="lazy" onerror="swapFallback(this)">';
}

function renderCards() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  getCards(active).forEach(card => {
    const state = (selections[card.cat] || {})[card.id];
    const article = document.createElement("article");
    article.className = "card " + (state === "primary" ? "primarySel" : state === "ref" ? "refSel" : "");

    article.innerHTML =
      '<div class="imgwrap">' +
        imageMarkup(card) +
        '<div class="badges">' +
          '<span class="badge">' + card.kind + '</span>' +
          (card.verified ? '<span class="badge verified">사양 확인</span>' : '') + (card.popular ? '<span class="badge">자주 쓰는 조합</span>' : '') +
        '</div>' +
        '<span class="sel">' + (state === "primary" ? "★ 대표" : "참고") + '</span>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="title">' + card.title + '</div>' +
        '<div class="spec">' + card.spec + '</div>' +
        '<div class="project">' + card.project + ' · <a href="' + card.src + '" target="_blank">원본/출처 보기 ↗</a></div>' +
        '<div class="hint">사진 클릭: 대표 ★ → 참고 → 해제</div>' +
      '</div>';

    article.querySelector(".imgwrap").onclick = () => cycleSelection(card);
    grid.appendChild(article);
  });
}

function renderResult() {
  const summary = document.getElementById("summary");
  summary.innerHTML = "";
  let any = false;

  DATA.categories.forEach(category => {
    const selected = selections[category.id] || {};
    const ids = Object.keys(selected);
    if (!ids.length) return;

    any = true;
    ids.sort((a,b) => {
      if (selected[a] === "primary") return -1;
      if (selected[b] === "primary") return 1;
      return 0;
    });

    const box = document.createElement("div");
    box.className = "sum";
    box.innerHTML = "<h3>" + category.label + "</h3>";

    ids.forEach(id => {
      const card = DATA.cards.find(c => c.id === id);
      if (!card) return;

      box.innerHTML +=
        '<div class="sumitem">' +
          '<div class="pic">' + imageMarkup(card) + '</div>' +
          '<div><b>' + (selected[id] === "primary" ? "★ 대표" : "참고") + '</b> · ' + card.title +
          '<br>' + card.spec +
          '<br><a href="' + card.src + '" target="_blank">원본 보기 ↗</a></div>' +
        '</div>';
    });

    summary.appendChild(box);
  });

  if (!any) {
    summary.innerHTML = '<div class="empty">아직 선택한 항목이 없습니다.</div>';
  }
}

function render() {
  renderTabs();

  const showingResult = active === "result";
  document.getElementById("cardSection").classList.toggle("hidden", showingResult);
  document.getElementById("resultSection").classList.toggle("hidden", !showingResult);

  const guide = document.getElementById("guide");

  if (showingResult) {
    guide.innerHTML = '<strong>업체 전달용 선택 결과</strong><div class="small">각 항목에서 ★ 대표 1개와 참고 최대 2개를 모아 보여줍니다.</div>';
    renderResult();
  } else {
    const category = getCategory(active);
    guide.innerHTML = '<strong>' + category.label + '</strong><div class="small">' + category.desc + '</div>';
    renderCards();
  }
}

document.getElementById("resetBtn").onclick = () => {
  if (confirm("선택을 전부 초기화할까요?")) {
    selections = {};
    saveSelections();
    render();
  }
};

document.getElementById("shareBtn").onclick = async () => {
  const encoded = btoa(encodeURIComponent(JSON.stringify(selections)));
  const url = new URL(location.href);
  url.searchParams.set("s", encoded);

  try {
    await navigator.clipboard.writeText(url.toString());
    alert("선택 상태가 포함된 링크를 복사했습니다.\n웹에 올린 뒤 사용하면 다른 사람에게도 같은 선택 상태로 공유할 수 있습니다.");
  } catch (e) {
    prompt("아래 링크를 복사하세요.", url.toString());
  }
};


function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function proxyUrl(src){
  if(!src) return '';
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(src) + '&w=1200&output=jpg&q=92';
}
function blobToDataUrl(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){ resolve(reader.result); };
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}
async function fetchImageAsDataUrl(card){
  var sources=[card.img].concat(card.fallbacks||[]).filter(Boolean);
  for(var i=0;i<sources.length;i++){
    try{
      var response=await fetch(proxyUrl(sources[i]), {mode:'cors', cache:'force-cache'});
      if(!response.ok) continue;
      var blob=await response.blob();
      if(!blob.type || blob.type.indexOf('image/')!==0) continue;
      return await blobToDataUrl(blob);
    }catch(e){}
  }
  return placeholderData(card.title||'이미지');
}
function collectSelectedSections(){
  var sections=[];
  DATA.categories.forEach(function(category){
    var selected=selections[category.id]||{};
    var ids=Object.keys(selected);
    if(!ids.length) return;
    ids.sort(function(a,b){
      if(selected[a]==='primary' && selected[b]!=='primary') return -1;
      if(selected[b]==='primary' && selected[a]!=='primary') return 1;
      return 0;
    });
    sections.push({category:category, ids:ids, selected:selected});
  });
  return sections;
}
async function buildExportSheet(){
  var sections=collectSelectedSections();
  var stage=document.createElement('div');
  stage.className='export-stage';
  var sheet=document.createElement('div');
  sheet.className='export-sheet';

  var now=new Date();
  var y=now.getFullYear();
  var m=String(now.getMonth()+1).padStart(2,'0');
  var d=String(now.getDate()).padStart(2,'0');

  var header=document.createElement('div');
  header.className='export-header';
  header.innerHTML =
    '<div class="export-title">인테리어 레퍼런스 선택 결과</div>' +
    '<div class="export-sub">업체 전달용 정리본 · 생성일 ' + y + '.' + m + '.' + d +
    '<br>각 항목에서 선택한 대표(★)와 참고 이미지를 한 장으로 모았습니다.</div>';
  sheet.appendChild(header);

  if(!sections.length){
    var empty=document.createElement('div');
    empty.className='export-empty';
    empty.textContent='선택한 항목이 없습니다.';
    sheet.appendChild(empty);
    stage.appendChild(sheet);
    document.body.appendChild(stage);
    return stage;
  }

  var grid=document.createElement('div');
  grid.className='export-grid';
  var tasks=[];

  sections.forEach(function(sec){
    var box=document.createElement('div');
    box.className='export-section';
    var h2=document.createElement('h2');
    h2.textContent=sec.category.label;
    box.appendChild(h2);

    var cardsWrap=document.createElement('div');
    cardsWrap.className='export-cards';

    sec.ids.forEach(function(id){
      var card=DATA.cards.find(function(c){ return c.id===id; });
      if(!card) return;
      var state=sec.selected[id];
      var roleClass=state==='primary' ? 'role' : 'role ref';
      var roleText=state==='primary' ? '★ 대표' : '참고';

      var cardEl=document.createElement('div');
      cardEl.className='export-card';

      var pic=document.createElement('div');
      pic.className='pic';
      var img=document.createElement('img');
      img.alt=card.title||'';
      img.src=placeholderData(card.title||'이미지');
      pic.appendChild(img);
      cardEl.appendChild(pic);

      tasks.push(
        fetchImageAsDataUrl(card).then(function(dataUrl){
          img.src=dataUrl;
        })
      );

      var txt=document.createElement('div');
      txt.className='txt';
      txt.innerHTML =
        '<span class="' + roleClass + '">' + roleText + '</span>' +
        '<div class="name">' + escapeHtml(card.title) + '</div>' +
        '<div class="desc">' + escapeHtml(card.spec) + '</div>' +
        '<div class="src">' + escapeHtml(card.project || '') + '</div>';
      cardEl.appendChild(txt);

      cardsWrap.appendChild(cardEl);
    });

    box.appendChild(cardsWrap);
    grid.appendChild(box);
  });

  sheet.appendChild(grid);
  stage.appendChild(sheet);
  document.body.appendChild(stage);

  await Promise.allSettled(tasks);
  await new Promise(function(resolve){ setTimeout(resolve,250); });
  return stage;
}
async function exportSelectionAsImage(){
  if(typeof html2canvas !== 'function'){
    alert('이미지 저장 기능 로딩에 실패했습니다. 새로고침 후 다시 시도해 주세요.');
    return;
  }
  var btn=document.getElementById('exportBtn');
  var oldText=btn.textContent;
  btn.disabled=true;
  btn.textContent='이미지 준비 중...';

  var stage=null;
  try{
    stage=await buildExportSheet();
    var target=stage.querySelector('.export-sheet');
    var canvas=await html2canvas(target,{
      scale:2,
      useCORS:false,
      allowTaint:false,
      backgroundColor:'#f4f2ee',
      logging:false,
      windowWidth:1300
    });
    var link=document.createElement('a');
    link.download='interior_reference_selection.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    console.error(err);
    alert('이미지 저장 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
  }finally{
    if(stage) stage.remove();
    btn.disabled=false;
    btn.textContent=oldText;
  }
}
document.getElementById("exportBtn").onclick = exportSelectionAsImage;

render();
</script>
