<html lang="ko">
<head>

<title>38D 인테리어 3D 모델</title>
<style>

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:3px 0}
.rl{font-size:12px;color:var(--text-secondary);width:44px;flex:none}
.opt{border-style:dashed !important;border-width:1.5px !important}
.opt.on{border-style:solid !important;border-color:var(--border-accent) !important;font-weight:600;background:#E6EEF6}
.vw.on{border-color:var(--border-accent) !important;font-weight:600;background:#E6EEF6}
.lg{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:#fff;border:1.5px solid;cursor:pointer;user-select:none}
.lg.off{opacity:.35;text-decoration:line-through}
#stage{position:relative;flex:1;min-height:320px;margin-top:4px}
#v{position:absolute;inset:0;border-radius:12px;border:1px solid var(--border);overflow:hidden;touch-action:none}
.note{font-size:12px;color:var(--text-secondary);padding:4px 0 0}
#cap{font-size:12px;color:var(--text-secondary);padding:4px 0;max-height:3.2em;overflow:auto}
</style>
</head>
<body>
<h1>38D 인테리어 3D 모델 (좌우 반전 세대)</h1>
<div>

<div class="row"><span class="rl">배치안</span><button class="opt" id="b0">1안</button><button class="opt" id="b1">2안</button><button class="opt" id="b2">4-2안</button><button class="opt" id="b3">5안</button><button class="opt" id="b4">6안 (기본)</button><button class="opt" id="b5">7안 T자</button><button class="opt" id="b6">8안</button></div>
<div class="row" id="lgr"><span class="rl">라벨</span></div>
</div>
<div id="stage">
<div id="v"></div>
<div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px">
<button id="zi" class="ob" aria-label="확대" style="width:38px;height:38px;font-size:22px;line-height:1;padding:0">+</button>
<button id="zo" class="ob" aria-label="축소" style="width:38px;height:38px;font-size:22px;line-height:1;padding:0">−</button>

<div style="position:absolute;left:10px;top:10px;display:flex;gap:6px">
<button id="mr" class="ob" style="height:34px;font-size:13px;padding:0 12px">회전</button>

</div>
</div>
